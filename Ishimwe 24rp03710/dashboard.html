<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Lost & Found Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style type="text/css">
    body{
      background-color: lightcyan;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Lost & Found</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="report-lost.html">Report Lost</a></li>
          <li class="nav-item"><a class="nav-link" href="report-found.html">Report Found</a></li>
          <li class="nav-item"><a class="nav-link active" href="items.html">All Items</a></li>
           <li class="nav-item"><a class="nav-link" href="dashboard.html"> Dashboard</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Item Grid -->
  <div class="container my-5">
    <h2 class="text-center mb-4">All Posted Items</h2>
    <div class="row" id="itemsContainer">
      <!-- Item cards will be inserted here by JavaScript -->
    </div>
  </div>

  <!-- Bootstrap + Script to Load Dummy Items -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const items = [
      {
        type: 'Lost',
        name: 'Black Wallet',
        desc: 'Black leather wallet lost near downtown on May 2.',
        location: 'Downtown',
        date: '2025-05-02',
        contact: 'john@example.com',
        image: 'https://via.placeholder.com/300x200'
      },
      {
        type: 'Found',
        name: 'Silver Bracelet',
        desc: 'Found at the park entrance on May 3.',
        location: 'City Park',
        date: '2025-05-03',
        contact: 'sara@example.com',
        image: 'https://via.placeholder.com/300x200'
      }
    ];

    const container = document.getElementById('itemsContainer');

    items.forEach(item => {
      container.innerHTML += `
        <div class="col-md-4 mb-4">
          <div class="card border-${item.type === 'Lost' ? 'danger' : 'success'}">
            <img src="${item.image}" class="card-img-top" alt="${item.name}">
            <div class="card-body">
              <h5 class="card-title">${item.name} <span class="badge bg-${item.type === 'Lost' ? 'danger' : 'success'}">${item.type}</span></h5>
              <p class="card-text">${item.desc}</p>
              <p class="card-text"><strong>Location:</strong> ${item.location}</p>
              <p class="card-text"><strong>Date:</strong> ${item.date}</p>
              <p class="card-text"><strong>Contact:</strong> ${item.contact}</p>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
